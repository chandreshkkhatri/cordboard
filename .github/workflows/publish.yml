name: Publish

# Push a tag like v0.3.0 to publish. Uses PyPI Trusted Publishing (OIDC), so no
# API token is stored in the repo — configure the publisher on PyPI first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Tag matches package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Test suite passes from the source distribution
        run: |
          sdist_root="${RUNNER_TEMP}/sdist"
          mkdir -p "${sdist_root}"
          tar xzf dist/*.tar.gz -C "${sdist_root}" --strip-components=1
          python -m venv "${RUNNER_TEMP}/sdist-env"
          "${RUNNER_TEMP}/sdist-env/bin/python" -m pip install "${sdist_root}[dev]"
          cd "${sdist_root}" && "${RUNNER_TEMP}/sdist-env/bin/python" -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cordboard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
